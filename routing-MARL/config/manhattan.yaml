net_file: "../network/manhattan/manhattan.net.xml"
route_file: "../network/manhattan/manhattan.rou.xml"
sumo_config: "../network/manhattan/manhattan.sumocfg" # make sure this file includes the net_file and route_file
routing_algorithm: "astar" # routing algorithm for vehicles (astar, dijkstra)

# output of reward and loss log in result folder
saved_dir: 'manhattan' # reward_d_weight_50eps

# configs destinations for agents (vehicles)
# Agent with the same destination are in the same group
destinations_edges: ['68674962#47', '1106469541#0', '5671357#17'] # ensure that these destination edges are connected with shelter nodes in the route file 
origin_edges: ['353220115#0', '68674962#0', '5671357#0']

disaster:
  fire:  
    disaster_zones:  
        1: ['-5669802#2', '68674962#26', '68674962#29'] # disaster at zone 1
    type: 'fire'

# training params
num_episodes: 200  # Number of training episodes
simulation_steps: 650 # Number of simulation steps per episode. This should also be configured the same in sumocfg file 
batch_size: 16            # Number of samples per training batch
update_frequency: 32         # Update network weights every N steps
buffer_capacity: 500         # Capacity of the replay buffer
learning_rate: 0.005        # Learning rate for optimizer
gamma: 0.9               # Discount factor for future rewards

# action selection by epsilon greedy policy
epsilon_greedy:
  initial: 1       # Starting value for epsilon
  final: 0.001               # Minimum epsilon value
  decay: 600       # Decay rate for epsilon per step. larger k → faster decay (epsilon drops quickly)

# action selection by UCB policy
UCB:
  c: 2 # exploration parameter for UCB

softmax:
  tau: 2 # lower tau->more exploitation

# params for reward calculation
reward_type: "R1" # R1, R1R2
reward:
  MSE:
    d_weight: 1 # penalty/weight for distance reward
    dead_edge: -10000000000000 # penalty for dead end edges
  R1R2: # reward for travel time and distance to disaster
    w1: 0.8 # weight for reward 1 travel time to destination
    w2: 0.2 # weight for reward 2 distance to disaster

max_vehicles_edge: 10 # Maximum allowed number of vehicles on an edge for normalization
max_speed: 13.89 # maximum speed of vehicles for normalization. For now, consider all edges have the same speed

