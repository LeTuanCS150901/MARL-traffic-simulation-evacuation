net_file: "../network/campfire/campfire.net.xml"
route_file: "../network/campfire/campfire.rou.xml"
sumo_config: "../network/campfire/campfire.sumocfg" # make sure this file includes the net_file and route_file
routing_algorithm: "astar" # routing algorithm for vehicles (astar, dijkstra)

# output of reward and loss log in result folder
saved_dir: 'campfire' # reward_d_weight_50eps
destinations_edges: ['10295137', '10290527'] # ensure that these destination edges are connected with shelter nodes in the route file 
origin_edges: ['538864401', '-10294329']

disaster:
  fire:  
    disaster_zones:  
        # 1: ['1061622295#0'] # disaster at zone 1
        # 1: ['852992110#0', '1061693983#0']  # disaster at zone 2
        # 3: ['-945473887#2', '-438389785#2'] # disaster at zone 3
        # 4: ['441405436#0'] # disaster at zone 4
    type: 'fire'
  POI_path: "../network/campfire/generated_pois_large.add.xml" # path to the dynamic coodinates of disaster
  speed: 52 # speed of disaster movement (m/s). 50m/s = 190km/h
  mode_activate: False # true means that we will activate the disaster following the zones above; 
                      # if we provide the disaster as external file in sumo config (or we don't use disaster),
                      # then this should be false


# training params
num_episodes: 2  # Number of training episodes
simulation_steps: 2800 # Number of simulation steps per episode. This should also be configured the same in sumocfg file 
batch_size: 16            # Number of samples per training batch
update_frequency: 32         # Update network weights every N steps
buffer_capacity: 500         # Capacity of the replay buffer
learning_rate: 0.005        # Learning rate for optimizer
gamma: 0.9               # Discount factor for future rewards

offline_training: True # True means train the expert beheavior and collect data for training the agents later
offline_data_path: '../routing_MARL/database/offline_campfire_data_Astar' # file to save expert data for offline RL


# action selection by epsilon greedy policy
epsilon_greedy:
  initial: 1       # Starting value for epsilon
  final: 0.001               # Minimum epsilon value
  decay: 600       # Decay rate for epsilon per step. larger k → faster decay (epsilon drops quickly)
# action selection by UCB policy
UCB:
  c: 2 # exploration parameter for UCB
softmax:
  tau: 2.3 # lower tau->more exploitation

# params for reward calculation
reward_type: "R1" # R1, R1R2
reward:
  MSE:
    d_weight: 1 # penalty/weight for distance reward
    dead_edge: -10000000000000 # penalty for dead end edges
  R1R2: # reward for travel time and distance to disaster
    w1: 0.8 # weight for reward 1 travel time to destination
    w2: 0.2 # weight for reward 2 distance to disaster

max_vehicles_edge: 25 # Maximum allowed number of vehicles on an edge for normalization
max_speed: 25 # maximum speed of vehicles for normalization. For now, consider all edges have the same speed




